<!--
  HManga Library — Trang Chủ Thư Viện Truyện (index.html)
  ======================================================
  Nhiệm vụ:
  1. Hiển thị danh sách tất cả các bộ truyện đã lưu trong thư viện dưới dạng lưới thẻ (Grid Cards).
  2. Thanh tìm kiếm nhanh thời gian thực (Live Search với Debounce 300ms chống spam request).
  3. Thanh điều hướng (Navbar) với logo thương hiệu, ô tìm kiếm trung tâm và liên kết trang (Thể loại, Tác giả, Thêm truyện).
  4. Hiển thị ảnh bìa tải từ server (/api/covers/{filename}) kèm ảnh dự phòng (rem.jpg) nếu lỗi.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HManga Library — Thư viện truyện tranh cá nhân</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="rem.jpg">
    <!-- File stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Thanh điều hướng trên cùng (Navbar) -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Logo thương hiệu và tên ứng dụng -->
            <a href="index.html" class="nav-brand">
                <img src="rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>

            <!-- Thanh tìm kiếm chính giữa Navbar dạng Quick Search & Advanced Button -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="search.html" method="GET" autocomplete="off" onsubmit="event.preventDefault();">
                    <div class="quick-search-wrapper">
                        <img src="data-icon/search.png" alt="Search" class="quick-search-icon">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Tìm tên truyện..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced" title="Advanced Search">
                        <svg class="bolt-icon" viewBox="0 0 24 24">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                        <span>Advanced<span class="btn-text-hide-mobile"> Search</span></span>
                    </a>
                </form>
            </div>

            <!-- Các nút hành động bên phải Navbar -->
            <div class="nav-links">
                <a href="genres.html" class="nav-link">🏷️ Thể loại</a>
                <a href="authors.html" class="nav-link">✍️ Tác giả</a>
                <a href="add.html" class="btn-add">
                    <img src="data-icon/plus.png" alt="Thêm" class="nav-icon">
                    <span>Thêm truyện</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Khu vực nội dung chính (Main Content) -->
    <main class="main-content">
        <!-- Tiêu đề trang và số lượng truyện hiện có -->
        <div class="page-header" style="text-align: center;">
            <h1 class="page-title" style="justify-content: center;">Thư Viện Truyện</h1>
            <p class="page-subtitle" id="comic-count">Đang tải danh sách...</p>
        </div>

        <!-- Lưới hiển thị danh sách thẻ truyện (Comic Cards Grid) -->
        <div id="comic-grid" class="comic-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-dim);">
                ⏳ Đang tải thư viện truyện...
            </div>
        </div>
    </main>

    <!-- Nạp file JavaScript tiện ích dùng chung -->
    <script src="app.js"></script>
    <script>
        let searchQuery = '';
        let debounceTimer;

        /**
         * Tải danh sách truyện từ Backend API và hiển thị lên lưới giao diện
         */
        async function loadComics() {
            const grid = document.getElementById('comic-grid');
            const countEl = document.getElementById('comic-count');
            
            try {
                // Gọi API lấy danh sách truyện (có thể kèm từ khóa tìm kiếm)
                const comics = await api.getComics({ q: searchQuery });
                countEl.textContent = `${comics.length} bộ truyện trong thư viện`;

                // Nếu thư viện còn trống
                if (comics.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 80px 20px;">
                            <p style="font-size: 18px; color: var(--text-muted); margin-bottom: 8px;">Chưa có bộ truyện nào</p>
                            <p style="font-size: 14px; color: var(--text-dim); margin-bottom: 20px;">Bắt đầu bằng cách thêm một bộ truyện mới từ hentaifox</p>
                            <a href="add.html" class="btn btn-primary">+ Thêm truyện ngay</a>
                        </div>
                    `;
                    return;
                }

                // Render danh sách các thẻ truyện (Comic Cards)
                grid.innerHTML = comics.map(comic => {
                    const coverUrl = api.getCoverUrl(comic.cover_filename);
                    // Hiển thị tối đa 3 thể loại đầu tiên, nếu nhiều hơn thì hiển thị thêm badge +N
                    const genresHtml = (comic.genres || []).slice(0, 3).map(g => 
                        `<span class="tag-chip">${g}</span>`
                    ).join('') + ((comic.genres && comic.genres.length > 3) ? `<span class="tag-chip">+${comic.genres.length - 3}</span>` : '');

                    return `
                        <a href="detail.html?id=${comic.id}" class="comic-card">
                            <div class="card-thumb-wrapper">
                                <img src="${coverUrl}" alt="${comic.title}" class="card-thumb" referrerpolicy="no-referrer" onerror="this.src='rem.jpg'">
                            </div>
                            <div class="card-body">
                                <div class="card-title" title="${comic.title}">${comic.title}</div>
                                <div class="card-author">${comic.author || 'Tác giả chưa rõ'}</div>
                                <div class="card-tags">${genresHtml}</div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--danger);">
                        ❌ Không thể kết nối tới máy chủ backend. Vui lòng đảm bảo backend đang chạy tại port 8000!
                    </div>
                `;
            }
        }

        // Đọc từ khóa tìm kiếm ban đầu từ URL Query (nếu người dùng chuyển từ trang khác sang)
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q') || urlParams.get('s');
        const searchInput = document.getElementById('inputQuickSearch');

        if (initialQuery && searchInput) {
            searchQuery = initialQuery;
            searchInput.value = initialQuery;
        }

        // Lắng nghe sự kiện gõ phím trên ô tìm kiếm nhanh (kèm Debounce 300ms)
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchQuery = e.target.value.trim();
                    loadComics();
                }, 300);
            });
        }

        // Tải danh sách truyện khi trang được mở
        loadComics();
    </script>
</body>
</html>
