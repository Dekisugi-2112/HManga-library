<!--
  HManga Library - Trinh Doc Truyen (reader.html)
  Che do doc: 1. Cuon doc  2. Tung trang
  Kich thuoc anh: aspect-ratio goc, max-height=100vh, max-width=100%, object-contain (chuan hentairead)
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Truyen - HManga Library</title>
    <link rel="icon" type="image/jpeg" href="rem.jpg">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #030712; margin: 0; padding: 0; overflow-x: hidden; }
    </style>
</head>
<body>
    <header class="reader-toolbar">
        <div class="reader-toolbar-inner">
            <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                <a id="btn-back-detail" href="index.html" class="btn btn-secondary btn-sm" style="flex-shrink:0;">&#x2190; Tro ve</a>
                <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    <span id="comic-header-title" style="font-weight:700;color:var(--text-main);font-size:14px;">Dang tai...</span>
                    <span id="chapter-header-badge" style="color:var(--primary);font-size:13px;font-weight:600;margin-left:6px;"></span>
                </div>
            </div>
            <div style="display:flex;background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:2px;flex-shrink:0;">
                <button type="button" id="mode-scroll-btn" class="btn btn-sm" style="background:var(--primary);color:#fff;">&#x1F4DC; Cuon doc</button>
                <button type="button" id="mode-page-btn" class="btn btn-sm" style="background:transparent;color:var(--text-muted);">&#x1F4C4; Tung trang</button>
            </div>
        </div>
    </header>

    <div class="reader-container" id="reader-container">
        <div id="scroll-view" class="scroll-mode-view">
            <div style="text-align:center;padding:80px 0;color:var(--text-dim);">&#x23F3; Dang ket noi va tai anh...</div>
        </div>
        <div id="page-view" class="page-mode-view" style="display:none;">
            <div class="page-mode-wrapper">
                <img id="single-page-img" class="reading-image" src="" alt="Trang truyen" referrerpolicy="no-referrer" style="display:none;" title="Bam vao anh de sang trang sau">
            </div>
            <div class="page-nav-controls">
                <button type="button" id="btn-prev-page" class="btn btn-secondary btn-sm">&#x21E6; Trang truoc</button>
                <span id="page-counter" style="font-size:15px;font-weight:700;font-family:monospace;color:#818cf8;">1 / 1</span>
                <button type="button" id="btn-next-page" class="btn btn-secondary btn-sm">Trang sau &#x21E8;</button>
            </div>
            <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">(Meo: Bam vao anh hoac dung phim mui ten &#x2190; &#x2192;)</p>
        </div>
        <div class="chapter-nav-bar">
            <button type="button" id="nav-prev-chap" class="btn btn-secondary" style="visibility:hidden;">&#x21E6; Chuong truoc</button>
            <a id="nav-comic-center" href="index.html" class="btn btn-secondary btn-sm" style="color:var(--text-muted);">&#x1F4DA; Ve bo truyen</a>
            <button type="button" id="nav-next-chap" class="btn btn-primary" style="visibility:hidden;">Chuong sau &#x21E8;</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chapterId = parseInt(urlParams.get('id'), 10);
        let currentMode = 'scroll';
        let pageUrls = [];
        let currentPageIndex = 0;
        let comicId = null;

        async function initReader() {
            if (!chapterId) {
                document.getElementById('scroll-view').innerHTML = '<div style="text-align:center;padding:60px 0;color:var(--danger);">&#x274C; Khong tim thay ID chuong hop le!</div>';
                return;
            }
            try {
                pageUrls = await api.getChapterPages(chapterId);
                const allComics = await api.getComics();
                let foundComic = null, foundChapter = null;
                for (const c of allComics) {
                    const detail = await api.getComic(c.id);
                    const ch = detail.chapters?.find(item => item.id === chapterId);
                    if (ch) { foundComic = detail; foundChapter = ch; break; }
                }
                if (foundComic) {
                    comicId = foundComic.id;
                    document.getElementById('comic-header-title').textContent = foundComic.title;
                    document.getElementById('chapter-header-badge').textContent = '&#x2022; Chuong ' + foundChapter.chapter_number;
                    document.getElementById('btn-back-detail').href = 'detail.html?id=' + comicId;
                    document.getElementById('nav-comic-center').href = 'detail.html?id=' + comicId;
                    const sortedChaps = [...(foundComic.chapters || [])].sort((a, b) => a.chapter_number - b.chapter_number);
                    const curIndex = sortedChaps.findIndex(ch => ch.id === chapterId);
                    if (curIndex > 0) {
                        const prevId = sortedChaps[curIndex - 1].id;
                        const prevBtn = document.getElementById('nav-prev-chap');
                        prevBtn.style.visibility = 'visible';
                        prevBtn.onclick = () => { window.location.href = 'reader.html?id=' + prevId; };
                    }
                    if (curIndex < sortedChaps.length - 1) {
                        const nextId = sortedChaps[curIndex + 1].id;
                        const nextBtn = document.getElementById('nav-next-chap');
                        nextBtn.style.visibility = 'visible';
                        nextBtn.onclick = () => { window.location.href = 'reader.html?id=' + nextId; };
                    }
                }
                renderScrollView();
                updateSinglePageView();
            } catch (err) {
                document.getElementById('scroll-view').innerHTML = '<div style="text-align:center;padding:60px 0;color:var(--danger);">&#x274C; Loi khi tai anh: ' + err.message + '</div>';
            }
        }

        function renderScrollView() {
            const scrollView = document.getElementById('scroll-view');
            if (pageUrls.length === 0) {
                scrollView.innerHTML = '<div style="padding:40px;color:var(--text-dim);">Khong co trang anh nao.</div>';
                return;
            }
            scrollView.innerHTML = pageUrls.map((url, i) =>
                '<div class="reader-page-wrapper" id="page-wrapper-' + i + '" data-page="' + (i+1) + '">' +
                '<img src="' + url + '" alt="Page ' + (i+1) + '" data-page="' + (i+1) + '" class="reading-image" loading="lazy" referrerpolicy="no-referrer"' +
                ' onload="if(this.naturalWidth&&this.naturalHeight){this.style.aspectRatio=this.naturalWidth+\' / \'+this.naturalHeight;}"' +
                ' onerror="this.onerror=null;this.src=\'rem.jpg\';this.style.maxHeight=\'300px\';">' +
                '</div>'
            ).join('');
        }

        function updateSinglePageView() {
            if (pageUrls.length === 0) return;
            const img = document.getElementById('single-page-img');
            img.src = pageUrls[currentPageIndex];
            img.alt = 'Page ' + (currentPageIndex + 1);
            img.setAttribute('data-page', currentPageIndex + 1);
            img.className = 'reading-image';
            img.onload = function() {
                if (this.naturalWidth && this.naturalHeight) {
                    this.style.aspectRatio = this.naturalWidth + ' / ' + this.naturalHeight;
                }
            };
            img.style.display = 'block';
            document.getElementById('page-counter').textContent = (currentPageIndex + 1) + ' / ' + pageUrls.length;
            document.getElementById('btn-prev-page').disabled = currentPageIndex === 0;
            document.getElementById('btn-next-page').disabled = currentPageIndex === pageUrls.length - 1;
        }

        document.getElementById('mode-scroll-btn').addEventListener('click', () => {
            currentMode = 'scroll';
            document.getElementById('mode-scroll-btn').style.cssText = 'background:var(--primary);color:#fff;';
            document.getElementById('mode-page-btn').style.cssText = 'background:transparent;color:var(--text-muted);';
            document.getElementById('scroll-view').style.display = 'flex';
            document.getElementById('page-view').style.display = 'none';
        });

        document.getElementById('mode-page-btn').addEventListener('click', () => {
            currentMode = 'page';
            document.getElementById('mode-page-btn').style.cssText = 'background:var(--primary);color:#fff;';
            document.getElementById('mode-scroll-btn').style.cssText = 'background:transparent;color:var(--text-muted);';
            document.getElementById('scroll-view').style.display = 'none';
            document.getElementById('page-view').style.display = 'flex';
            updateSinglePageView();
        });

        document.getElementById('btn-prev-page').addEventListener('click', () => {
            if (currentPageIndex > 0) { currentPageIndex--; updateSinglePageView(); window.scrollTo({top:0,behavior:'smooth'}); }
        });
        document.getElementById('btn-next-page').addEventListener('click', () => {
            if (currentPageIndex < pageUrls.length - 1) { currentPageIndex++; updateSinglePageView(); window.scrollTo({top:0,behavior:'smooth'}); }
        });
        document.getElementById('single-page-img').addEventListener('click', () => {
            if (currentPageIndex < pageUrls.length - 1) { currentPageIndex++; updateSinglePageView(); window.scrollTo({top:0,behavior:'smooth'}); }
        });
        window.addEventListener('keydown', (e) => {
            if (currentMode !== 'page') return;
            if ((e.key === 'ArrowRight' || e.key === 'ArrowDown') && currentPageIndex < pageUrls.length - 1) {
                currentPageIndex++; updateSinglePageView();
            } else if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && currentPageIndex > 0) {
                currentPageIndex--; updateSinglePageView();
            }
        });

        initReader();
    </script>
</body>
</html>
