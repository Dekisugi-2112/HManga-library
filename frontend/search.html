<!--
  HManga Library — Trang Tìm Kiếm & Lọc Nâng Cao (search.html)
  ===========================================================
  Nhiệm vụ:
  1. Cung cấp form tìm kiếm kết hợp nhiều tiêu chí:
     - Tên bộ truyện (tìm kiếm mờ ilike).
     - Tác giả (gợi ý tự động hoặc nhập tay).
     - Thể loại (dropdown chọn thể loại kèm số lượng truyện).
  2. Hiển thị kết quả tìm kiếm theo dạng lưới thẻ truyện (Grid Cards).
  3. Cho phép người dùng đặt lại bộ lọc tìm kiếm (Reset filter) về mặc định.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="rem.jpg">
    <!-- File stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Thanh điều hướng trên cùng (Navbar) -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Logo thương hiệu -->
            <a href="index.html" class="nav-brand">
                <img src="rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>

            <!-- Thanh tìm kiếm chính giữa Navbar dạng Quick Search & Advanced Button -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="index.html" method="GET" autocomplete="off">
                    <div class="quick-search-wrapper">
                        <img src="data-icon/search.png" alt="Search" class="quick-search-icon">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced always-visible" title="Advanced Search">
                        <svg class="bolt-icon" viewBox="0 0 24 24">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                        <span>Advanced<span class="btn-text-hide-mobile"> Search</span></span>
                    </a>
                </form>
            </div>

            <!-- Các nút điều hướng bên phải -->
            <div class="nav-links">
                <a href="genres.html" class="nav-link">🏷️ Thể loại</a>
                <a href="authors.html" class="nav-link">✍️ Tác giả</a>
                <a href="add.html" class="btn-add">
                    <img src="data-icon/plus.png" alt="Thêm" class="nav-icon">
                    <span>Thêm truyện</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Khu vực nội dung chính (Main Content) -->
    <main class="main-content">
        <!-- Tiêu đề trang tìm kiếm -->
        <div class="page-header">
            <h1 class="page-title">🔍 Tìm Kiếm & Lọc Truyện</h1>
            <p class="page-subtitle">Tìm kiếm kết hợp theo tên bộ truyện, tác giả và thể loại</p>
        </div>

        <!-- FORM TÌM KIẾM NÂNG CAO -->
        <div class="card" style="margin-bottom: 24px;">
            <form id="search-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tên truyện:</label>
                        <input type="text" id="search-q" class="form-control" placeholder="Nhập từ khóa tên truyện...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tác giả:</label>
                        <input type="text" id="search-author" list="search-authors-datalist" class="form-control" placeholder="Nhập hoặc chọn tên tác giả...">
                        <datalist id="search-authors-datalist"></datalist>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Thể loại:</label>
                    <select id="search-genre" class="form-control">
                        <option value="">-- Tất cả thể loại --</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">🔍 Bắt đầu tìm kiếm</button>
                    <button type="button" id="btn-reset-search" class="btn btn-secondary">Đặt lại bộ lọc</button>
                </div>
            </form>
        </div>

        <!-- KHU VỰC HIỂN THỊ KẾT QUẢ TÌM KIẾM -->
        <div id="results-header" style="margin-bottom: 16px; font-size: 15px; font-weight: 600; color: var(--text-muted); display: none;">
            Kết quả tìm kiếm (<span id="results-count" style="color: var(--primary);">0</span>)
        </div>

        <!-- Lưới thẻ kết quả truyện -->
        <div id="results-grid" class="comic-grid"></div>
    </main>

    <!-- Nạp file JavaScript tiện ích dùng chung -->
    <script src="app.js"></script>
    <script>
        // Nạp dữ liệu ban đầu cho các dropdown thể loại và danh sách tác giả
        document.addEventListener('DOMContentLoaded', async () => {
            // Nạp danh sách thể loại vào thẻ <select>
            try {
                const genres = await api.getGenres();
                const genreSelect = document.getElementById('search-genre');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.name;
                    opt.textContent = `${g.name} (${g.comic_count} truyện)`;
                    genreSelect.appendChild(opt);
                });
            } catch (err) {
                console.warn('Lỗi nạp thể loại tìm kiếm:', err);
            }

            // Nạp danh sách tác giả vào thẻ <datalist>
            try {
                const authors = await api.getAuthors();
                const datalist = document.getElementById('search-authors-datalist');
                datalist.innerHTML = authors.map(a => `<option value="${a.name}">`).join('');
            } catch (err) {
                console.warn('Lỗi nạp tác giả tìm kiếm:', err);
            }

            // Thực hiện tìm kiếm ban đầu
            doSearch();
        });

        /**
         * Hàm thực hiện tìm kiếm kết hợp nhiều tiêu chí và vẽ kết quả lên lưới
         */
        async function doSearch() {
            const q = document.getElementById('search-q').value.trim();
            const author = document.getElementById('search-author').value.trim();
            const genre = document.getElementById('search-genre').value.trim();

            const grid = document.getElementById('results-grid');
            const resHeader = document.getElementById('results-header');
            const countEl = document.getElementById('results-count');

            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-dim);">⏳ Đang tìm kiếm...</div>';

            try {
                // Gọi API tìm kiếm nâng cao từ Backend
                const results = await api.searchComics({ q, author, genre });
                resHeader.style.display = 'block';
                countEl.textContent = results.length;

                // Nếu không có kết quả phù hợp
                if (results.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
                            <p style="font-size: 16px; margin-bottom: 6px;">Không tìm thấy bộ truyện nào phù hợp</p>
                            <p style="font-size: 13px; color: var(--text-dim);">Hãy thử giảm bớt điều kiện tìm kiếm</p>
                        </div>
                    `;
                    return;
                }

                // Render danh sách các thẻ truyện tìm được
                grid.innerHTML = results.map(comic => {
                    const coverUrl = api.getCoverUrl(comic.cover_filename);
                    const genresHtml = (comic.genres || []).slice(0, 3).map(g => 
                        `<span class="tag-chip">${g}</span>`
                    ).join('');

                    return `
                        <a href="detail.html?id=${comic.id}" class="comic-card">
                            <div class="card-thumb-wrapper">
                                <img src="${coverUrl}" alt="${comic.title}" class="card-thumb" referrerpolicy="no-referrer" onerror="this.src='rem.jpg'">
                            </div>
                            <div class="card-body">
                                <div class="card-title" title="${comic.title}">${comic.title}</div>
                                <div class="card-author">${comic.author || 'Tác giả chưa rõ'}</div>
                                <div class="card-tags">${genresHtml}</div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--danger);">
                        ❌ Lỗi tìm kiếm: ${err.message}
                    </div>
                `;
            }
        }

        // Lắng nghe Submit form tìm kiếm
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            doSearch();
        });

        // Nút đặt lại bộ lọc tìm kiếm
        document.getElementById('btn-reset-search').addEventListener('click', () => {
            document.getElementById('search-form').reset();
            doSearch();
        });
    </script>
</body>
</html>
