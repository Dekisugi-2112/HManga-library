<!--
  HManga Library — Trang Chi Tiết Bộ Truyện (detail.html)
  =======================================================
  Nhiệm vụ:
  1. Hiển thị thông tin tổng quan của bộ truyện: Ảnh bìa, Tên truyện, Tác giả, Thể loại.
  2. Hiển thị danh sách các chương (Chapters) kèm số trang và liên kết vào trình đọc (reader.html).
  3. Cung cấp Modal Sửa thông tin truyện (Đổi tên, Tác giả với AuthorAutocomplete, Thể loại với GenreSelector).
  4. Cung cấp Modal Thêm chương mới cho bộ truyện.
  5. Cung cấp Modal Chỉnh sửa chương (Đổi số thứ tự chương, đổi tên chương).
  6. Cung cấp chức năng Xóa chương và Xóa vĩnh viễn toàn bộ bộ truyện.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Truyện — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="rem.jpg">
    <!-- Stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }
        .detail-cover-box {
            width: 300px;
            flex-shrink: 0;
        }
        .detail-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }
        .detail-info {
            flex: 1;
            min-width: 0;
        }
        .chapter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .chapter-row:hover {
            border-color: var(--border-hover);
        }
        .chapter-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        @media (max-width: 640px) {
            .detail-header {
                flex-direction: column;
                align-items: center;
            }
            .detail-cover-box {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- 1. Thanh điều hướng trên cùng (Navbar) -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>
            <!-- Thanh tìm kiếm nhanh trên Navbar -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="index.html" method="GET" autocomplete="off">
                    <div class="quick-search-wrapper">
                        <img src="data-icon/search.png" alt="Search" class="quick-search-icon">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced" title="Advanced Search">
                        <svg class="bolt-icon" viewBox="0 0 24 24">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                        <span>Advanced<span class="btn-text-hide-mobile"> Search</span></span>
                    </a>
                </form>
            </div>
            <div class="nav-links">
                <a href="genres.html" class="nav-link">🏷️ Thể loại</a>
                <a href="authors.html" class="nav-link">✍️ Tác giả</a>
                <a href="add.html" class="btn-add">
                    <img src="data-icon/plus.png" alt="Thêm" class="nav-icon">
                    <span>Thêm truyện</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Khu vực nội dung chính (Main Content) -->
    <main class="main-content" style="max-width: 900px;">
        <!-- Khung hiển thị thông tin chi tiết bộ truyện -->
        <div id="comic-detail-content">
            <div style="text-align: center; padding: 60px 0; color: var(--text-dim);">⏳ Đang tải thông tin bộ truyện...</div>
        </div>

        <!-- Khung hiển thị danh sách các chương (Chapters) -->
        <div class="card" id="chapters-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 18px; font-weight: 700; color: var(--text-main);" id="chapters-heading">Danh Sách Chương (0)</h2>
                <button type="button" id="btn-open-add-chapter" class="btn btn-primary btn-sm">+ Thêm chương mới</button>
            </div>
            <div id="chapter-list-container"></div>
        </div>
    </main>

    <!-- ==================== MODAL: SỬA THÔNG TIN TRUYỆN ==================== -->
    <div id="modal-edit-comic" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Chỉnh Sửa Thông Tin Bộ Truyện</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-edit-comic')">&times;</button>
            </div>
            <form id="form-edit-comic">
                <div class="form-group">
                    <label class="form-label">Tên truyện *</label>
                    <input type="text" id="edit-comic-title" class="form-control" required>
                </div>
                <!-- Gợi ý tác giả thông minh -->
                <div class="form-group">
                    <label class="form-label">Tác giả</label>
                    <input type="text" id="edit-comic-author" class="form-control" placeholder="Gõ để tìm tác giả có sẵn hoặc tạo tác giả mới..." autocomplete="off">
                </div>
                <!-- Chọn thể loại dạng Chips -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label class="form-label" style="margin: 0;">Chọn thể loại:</label>
                        <a href="genres.html" target="_blank" style="font-size: 12px; color: var(--primary); text-decoration: none;">⚙️ Quản lý thể loại</a>
                    </div>
                    <div id="edit-genres-container"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-edit-comic')">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MODAL: THÊM CHƯƠNG MỚI ==================== -->
    <div id="modal-add-chapter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">➕ Thêm Chương Mới</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-add-chapter')">&times;</button>
            </div>
            <form id="form-add-chapter">
                <div class="form-group">
                    <label class="form-label">Dán link ảnh chương (hentaifox):</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="new-chap-url" class="form-control" placeholder="https://i3.hentaifox.com/004/4029076/1t.jpg" required>
                        <button type="button" id="btn-parse-new-chap" class="btn btn-secondary btn-sm" style="white-space: nowrap;">Bóc tách</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Số thứ tự chương *</label>
                        <input type="number" id="new-chap-num" class="form-control" step="0.5" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tên chương (Tùy chọn)</label>
                        <input type="text" id="new-chap-title" class="form-control" placeholder="Tùy chọn...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Từ trang (Bắt đầu) *</label>
                        <input type="number" id="new-chap-start-page" class="form-control" value="1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Đến trang (Kết thúc) *</label>
                        <input type="number" id="new-chap-end-page" class="form-control" min="1" placeholder="Trang cuối..." required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-add-chapter')">Hủy</button>
                    <button type="submit" class="btn btn-primary">Thêm chương</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MODAL: SỬA CHƯƠNG ==================== -->
    <div id="modal-edit-chapter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Chỉnh Sửa Chương</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-edit-chapter')">&times;</button>
            </div>
            <form id="form-edit-chapter">
                <input type="hidden" id="edit-chap-id">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Số thứ tự chương *</label>
                        <input type="number" id="edit-chap-num" class="form-control" step="0.5" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tên chương:</label>
                        <input type="text" id="edit-chap-title" class="form-control" placeholder="Tùy chọn...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Từ trang (Bắt đầu) *</label>
                        <input type="number" id="edit-chap-start-page" class="form-control" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Đến trang (Kết thúc) *</label>
                        <input type="number" id="edit-chap-end-page" class="form-control" min="1" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-edit-chapter')">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu chương</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nạp file JavaScript tiện ích dùng chung -->
    <script src="app.js"></script>
    <script>
        // Lấy ID bộ truyện từ Query Parameter (VD: detail.html?id=5 hoặc detail.html?id=001-48410)
        const urlParams = new URLSearchParams(window.location.search);
        let comicId = urlParams.get('id');
        let currentComic = null;
        let editGenreSelector = null;
        let editAuthorAutocomplete = null;

        /** Đóng một modal popup theo ID */
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        /** Mở một modal popup theo ID */
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        /**
         * Tải toàn bộ thông tin chi tiết của bộ truyện và các chương từ Backend API
         */
        async function loadComicDetail() {
            if (!comicId) {
                document.getElementById('comic-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: var(--danger);">
                        ❌ Không tìm thấy ID truyện hợp lệ! <br><br>
                        <a href="index.html" class="btn btn-secondary">← Về trang chủ</a>
                    </div>
                `;
                return;
            }

            try {
                // Gọi API lấy chi tiết bộ truyện (hỗ trợ cả ID số hoặc mã 001-48410)
                currentComic = await api.getComic(comicId);
                comicId = currentComic.id; // Đồng bộ sang ID số nguyên chuẩn
                const coverUrl = api.getCoverUrl(currentComic.cover_filename);
                const genresHtml = (currentComic.genres || []).map(g => `<a href="genres.html" class="tag-chip" style="font-size: 11px; padding: 3px 8px; text-decoration: none;">🏷️ ${g}</a>`).join('');

                // Render phần Header chi tiết truyện
                document.getElementById('comic-detail-content').innerHTML = `
                    <div class="detail-header">
                        <div class="detail-cover-box">
                            <img src="${coverUrl}" alt="${currentComic.title}" class="detail-cover" referrerpolicy="no-referrer" onerror="this.src='rem.jpg'">
                        </div>
                        <div class="detail-info">
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;">
                                <span class="badge" style="background: rgba(99, 102, 241, 0.2); color: #c7d2fe; font-family: monospace; font-weight: 700; font-size: 13px;">ID: ${currentComic.gallery_id || currentComic.id}</span>
                                <h1 style="font-size: 24px; font-weight: 800; color: var(--text-main);">${currentComic.title}</h1>
                            </div>
                            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 12px;">Tác giả: <a href="authors.html" style="color: var(--text-main); font-weight: 500; text-decoration: none;">✍️ ${currentComic.author || 'Chưa rõ'}</a></p>
                            <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                                ${genresHtml || '<span style="color: var(--text-dim); font-size: 12px;">Chưa chọn thể loại nào</span>'}
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;">
                                <button type="button" onclick="openEditComicModal()" class="btn btn-secondary btn-sm">✏️ Sửa thông tin</button>
                                <button type="button" onclick="confirmDeleteComic()" class="btn btn-danger btn-sm">🗑 Xóa bộ truyện</button>
                            </div>
                        </div>
                    </div>
                `;

                // Render danh sách các Chapters đã sắp xếp
                const chapters = [...(currentComic.chapters || [])].sort((a, b) => a.chapter_number - b.chapter_number);
                document.getElementById('chapters-heading').textContent = `Danh Sách Chương (${chapters.length})`;
                const chapContainer = document.getElementById('chapter-list-container');
                
                if (chapters.length === 0) {
                    chapContainer.innerHTML = `<p style="text-align: center; color: var(--text-dim); padding: 30px 0;">Chưa có chương nào. Hãy bấm "+ Thêm chương mới" để thêm!</p>`;
                } else {
                    chapContainer.innerHTML = chapters.map(ch => {
                        const startP = ch.start_page || 1;
                        const endP = ch.end_page || ch.total_pages || startP;
                        const pageCount = ch.total_pages || (endP - startP + 1);
                        const titleEscaped = (ch.title || '').replace(/'/g, "\\'");

                        return `
                            <div class="chapter-row">
                                <a href="reader.html?id=${ch.id}" class="chapter-link">
                                    <span style="font-weight: 700; color: var(--primary); font-family: monospace; font-size: 15px;">Ch.${ch.chapter_number}</span>
                                    <span style="font-size: 14px; font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ch.title || ''}</span>
                                    <span style="color: var(--text-dim); font-size: 12px;">(${pageCount} trang: trang ${startP} → ${endP})</span>
                                </a>
                                <div style="display: flex; gap: 6px;">
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="openEditChapterModal(${ch.id}, ${ch.chapter_number}, '${titleEscaped}', ${startP}, ${endP})">✏️</button>
                                    <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteChapter(${ch.id})">✕</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                document.getElementById('chapters-card').style.display = 'block';

            } catch (err) {
                document.getElementById('comic-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: var(--danger);">
                        ❌ Không thể nạp thông tin bộ truyện! (${err.message})
                    </div>
                `;
            }
        }

        // ==================== SỬA THÔNG TIN BỘ TRUYỆN ====================
        /** Mở modal chỉnh sửa thông tin truyện */
        async function openEditComicModal() {
            if (!currentComic) return;
            document.getElementById('edit-comic-title').value = currentComic.title;
            document.getElementById('edit-comic-author').value = currentComic.author || '';

            // Khởi tạo component chọn thể loại
            if (!editGenreSelector) {
                editGenreSelector = new GenreSelectorComponent('edit-genres-container', [], currentComic.genres || []);
            } else {
                editGenreSelector.setSelectedGenres(currentComic.genres || []);
            }

            // Nạp danh sách thể loại từ server
            try {
                const genres = await api.getGenres();
                editGenreSelector.setAvailableGenres(genres);
                editGenreSelector.setSelectedGenres(currentComic.genres || []);
            } catch {}

            // Nạp danh sách tác giả cho bộ autocomplete
            if (!editAuthorAutocomplete) {
                editAuthorAutocomplete = new AuthorAutocompleteComponent('edit-comic-author');
            }
            try {
                const authors = await api.getAuthors();
                editAuthorAutocomplete.setAuthors(authors);
            } catch {}

            openModal('modal-edit-comic');
        }

        // Lắng nghe Submit form sửa thông tin truyện
        document.getElementById('form-edit-comic').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.updateComic(comicId, {
                    title: document.getElementById('edit-comic-title').value.trim(),
                    author: document.getElementById('edit-comic-author').value.trim() || undefined,
                    genres: editGenreSelector.getSelectedGenres()
                });
                closeModal('modal-edit-comic');
                showToast('Đã cập nhật thông tin bộ truyện!', 'success');
                loadComicDetail(); // Nạp lại trang chi tiết
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== THÊM CHƯƠNG MỚI ====================
        /** Mở modal thêm chương mới */
        document.getElementById('btn-open-add-chapter').addEventListener('click', () => {
            const chapters = currentComic?.chapters || [];
            // Tự động tính số chương tiếp theo (VD: max + 1)
            const nextNum = chapters.length > 0 ? Math.max(...chapters.map(c => c.chapter_number)) + 1 : 1;
            document.getElementById('new-chap-num').value = nextNum;
            document.getElementById('new-chap-url').value = '';
            document.getElementById('new-chap-title').value = '';

            // Tự động gợi ý trang bắt đầu tiếp theo từ chương liền trước
            const maxEndPage = chapters.length > 0 ? Math.max(...chapters.map(c => c.end_page || c.total_pages || 0)) : 0;
            document.getElementById('new-chap-start-page').value = maxEndPage > 0 ? maxEndPage + 1 : 1;
            document.getElementById('new-chap-end-page').value = '';

            openModal('modal-add-chapter');
        });

        // Bóc tách URL khi người dùng bấm nút "Bóc tách"
        document.getElementById('btn-parse-new-chap').addEventListener('click', () => {
            const url = document.getElementById('new-chap-url').value.trim();
            const parsed = parseHentaifoxUrl(url);
            if (!parsed) {
                showToast('Link không đúng định dạng hentaifox!', 'warning');
            } else {
                showToast(`Phát hiện Gallery ID: ${parsed.galleryId}`, 'info');
                if (parsed.pageNumber) {
                    document.getElementById('new-chap-start-page').value = parsed.pageNumber;
                }
            }
        });

        // Lắng nghe Submit form thêm chương mới
        document.getElementById('form-add-chapter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('new-chap-url').value.trim();
            const chapterNum = parseFloat(document.getElementById('new-chap-num').value);
            const startPage = parseInt(document.getElementById('new-chap-start-page').value, 10) || 1;
            const endPage = parseInt(document.getElementById('new-chap-end-page').value, 10);
            const title = document.getElementById('new-chap-title').value.trim();

            if (endPage < startPage) {
                showToast('Trang kết thúc phải lớn hơn hoặc bằng trang bắt đầu!', 'warning');
                return;
            }

            try {
                await api.createChapter(comicId, {
                    chapter_number: chapterNum,
                    title: title || undefined,
                    base_url: url,
                    start_page: startPage,
                    end_page: endPage
                });
                closeModal('modal-add-chapter');
                showToast(`Đã thêm chương ${chapterNum} (${endPage - startPage + 1} trang) thành công!`, 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== SỬA CHƯƠNG ====================
        /** Mở modal chỉnh sửa một chương */
        function openEditChapterModal(id, num, title, startPage, endPage) {
            document.getElementById('edit-chap-id').value = id;
            document.getElementById('edit-chap-num').value = num;
            document.getElementById('edit-chap-title').value = title;
            document.getElementById('edit-chap-start-page').value = startPage || 1;
            document.getElementById('edit-chap-end-page').value = endPage || startPage || 1;
            openModal('modal-edit-chapter');
        }

        // Lắng nghe Submit form sửa chương
        document.getElementById('form-edit-chapter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const chapId = parseInt(document.getElementById('edit-chap-id').value, 10);
            const chapNum = parseFloat(document.getElementById('edit-chap-num').value);
            const chapTitle = document.getElementById('edit-chap-title').value.trim();
            const startPage = parseInt(document.getElementById('edit-chap-start-page').value, 10) || 1;
            const endPage = parseInt(document.getElementById('edit-chap-end-page').value, 10);

            if (endPage < startPage) {
                showToast('Trang kết thúc phải lớn hơn hoặc bằng trang bắt đầu!', 'warning');
                return;
            }

            try {
                await api.updateChapter(chapId, {
                    chapter_number: chapNum,
                    title: chapTitle || undefined,
                    start_page: startPage,
                    end_page: endPage
                });
                closeModal('modal-edit-chapter');
                showToast('Đã cập nhật chương thành công!', 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== XÓA CHƯƠNG & XÓA BỘ TRUYỆN ====================
        /** Xác nhận và xóa một chương */
        async function confirmDeleteChapter(chapId) {
            if (!confirm('Bạn có chắc chắn muốn xóa chương này không?')) return;
            try {
                await api.deleteChapter(chapId);
                showToast('Đã xóa chương thành công!', 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        /** Xác nhận và xóa hoàn toàn toàn bộ bộ truyện */
        async function confirmDeleteComic() {
            if (!confirm(`Bạn có chắc chắn muốn xóa hoàn toàn bộ truyện "${currentComic.title}" và toàn bộ các chương không?`)) return;
            try {
                await api.deleteComic(comicId);
                showToast('Đã xóa bộ truyện thành công!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Nạp dữ liệu khi mở trang
        loadComicDetail();
    </script>
</body>
</html>
